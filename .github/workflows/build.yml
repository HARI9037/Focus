name: Build and verify Focus
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true
      - run: python3 tools/check_native.py
      - run: python3 tools/check_source.py
      - run: python3 tools/bootstrap.py
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Focus-Android-development-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true
      - run: python tools/bootstrap.py
      - run: flutter analyze
      - run: flutter test
      - run: flutter test integration_test/app_test.dart -d windows
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Focus-Windows
          path: build/windows/x64/runner/Release/**
